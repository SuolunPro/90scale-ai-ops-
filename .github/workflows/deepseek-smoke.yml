name: DeepSeek smoke test
on:
  push:
    paths: ['.github/workflows/deepseek-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API and public website check
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          key=os.environ.get('DEEPSEEK_API_KEY')
          if not key: raise SystemExit('Missing secret')
          with urllib.request.urlopen('https://suolunpro.github.io/', timeout=20) as r:
              print('Website HTTP:',r.status)
          req=urllib.request.Request('https://api.deepseek.com/chat/completions',data=json.dumps({'model':'deepseek-chat','messages':[{'role':'user','content':'Reply only OK'}],'max_tokens':16}).encode(),headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=60) as r:
                  result=json.load(r)
                  print('API HTTP:',r.status,'usage:',result.get('usage',{}))
                  assert result.get('choices')
          except urllib.error.HTTPError as e:
              raise SystemExit('API HTTP error: '+str(e.code))
          PY
