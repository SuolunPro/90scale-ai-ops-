name: Token authorization check
on:
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify repository and Actions read access
        env:
          GH_TOKEN: ${{ secrets.ENGINE4_REPAIR_TOKEN }}
        run: |
          set -eu
          test -n "$GH_TOKEN" || { echo 'Secret missing'; exit 1; }
          for repo in SuolunPro/90scale-engine SuolunPro/suolunpro.github.io; do
            echo "Checking $repo"
            gh api "repos/$repo" --jq '"Repository access OK"'
            gh api "repos/$repo/contents" --jq '"Contents read OK"'
            gh api "repos/$repo/actions/workflows?per_page=1" --jq '"Actions read OK"'
          done
          echo 'Read checks passed; write permissions not tested.'
