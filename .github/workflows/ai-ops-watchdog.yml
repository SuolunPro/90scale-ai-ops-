name: 九十刻度 AI 运维 · 公开补偿复验

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 复验公开自愈回执与正式站快照
        env:
          ENGINE4_READ_TOKEN: ${{ secrets.ENGINE4_READ_TOKEN }}
          ENGINE4_REPAIR_TOKEN: ${{ secrets.ENGINE4_REPAIR_TOKEN }}
        run: |
          set -o pipefail
          python ops/watchdog.py | tee -a "$GITHUB_STEP_SUMMARY"
