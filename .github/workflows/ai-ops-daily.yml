name: 九十刻度 AI 运维 · 每日汇总

on:
  schedule:
    # 23:30 Beijing time, after the last scheduled sales cutoff.
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: 90scale-ai-ops-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 生成当日运维摘要并写入 logs/daily.jsonl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGINE4_READ_TOKEN: ${{ secrets.ENGINE4_READ_TOKEN }}
        run: python ops/daily.py --config config/ops.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-ops-daily-${{ github.run_id }}
          path: state/daily-latest.md
          retention-days: 30
