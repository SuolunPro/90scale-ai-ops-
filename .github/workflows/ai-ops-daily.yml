name: 九十刻度 AI 运维 · 每日汇总

on:
  schedule:
    # 00:10 Beijing time (16:10 UTC previous day).
    - cron: '10 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: 90scale-ai-ops-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 生成当日运维摘要并写入 logs/daily.jsonl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python ops/daily.py --config config/ops.json | tee daily.out
          {
            echo "## 每日运维摘要"
            echo ''
            echo '```json'
            head -c 4000 daily.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
